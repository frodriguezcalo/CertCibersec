name: Pipeline SonarCloud y Semgrep con Juice Shop

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  analisis-sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configuración de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" 

      - name: Instalar dependencias
        run: |
          npm install

      - name: Análisis de SonarCloud
        uses: sonarsource/sonarcloud-github-action@v3.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  analisis-semgrep:
    runs-on: ubuntu-latest
    needs: analisis-sonar
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep
        uses: semgrep/semgrep-action@v1
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

## opcion 1: utilizando trivy con tabla en los logs de GitHub Actions

  analisis-sca-trivy:
    runs-on: ubuntu-latest
    needs: analisis-semgrep
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Ejecutar Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'             # fs es filesystem, para que analice todo 
          scan-ref: '.'               # Raíz del proyecto
          format: 'table'             # Muestra la tabla de resultados en el log de Actions
          severity: 'CRITICAL,HIGH,MEDIUM'  # Podemos sacarlo y eso incluye LOW y UNKNOWN

